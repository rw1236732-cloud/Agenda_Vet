<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
  <form id="form-agendamento">
    <h1>Agendar Atendimento</h1>
    <h2>Dados do tutor</h2>

    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" required><br><br>

    <label for="email">Telefone:</label>
    <input type="tel" id="email" name="email" required><br><br>
    <h2>Dados do Pet</h2>

    <label for="nome-pet">Nome do Pet:</label>
    <input type="text" id="nome-pet" name="nome-pet" required>
    <br><br>
    <label for="raça">Raça:</label>
    <select name="tipo de raça" id="raça">
      <option value="Cachorro">Cachorro</option>
      <option value="Gato">Gato</option>
    </select>

    <div></div>
    <br><br>
    <input type="submit" value="Agendar Atendimento">
  </form>
</div>
</body>
</html>
