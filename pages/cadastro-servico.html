<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Serviço - PetAgenda</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="site-header">
        <img src="../img/logo.png" alt="PetAgenda" class="logo" width="180" height="180">
        <nav>
            <a href="lista-de-agendamento.html">Agenda</a>
            <a href="Agendar Atendimento.html">Agendar Atendimento</a>
            <a href="cadastro-tutor.html">Cadastrar tutor</a>
            <a href="cadastro-pet.html">Cadastrar pet</a>
            <a href="cadastro-servico.html">Serviços</a>
        </nav>
    </header>

    <main class="container">
        <h1>Cadastrar Tipo de Serviço</h1>

        <!-- Formulário de Cadastro -->
        <form id="form-servico" style="margin-bottom: 30px;">
            <div>
                <label for="servico-nome">Nome do Serviço (ex: Banho, Tosa):</label>
                <input type="text" id="servico-nome" required>
            </div>
            <div>
                <label for="servico-preco">Preço (R$):</label>
                <input type="number" id="servico-preco" step="0.01" min="0" required>
            </div>
            <div>
                <label for="servico-descricao">Descrição (Opcional):</label>
                <input type="text" id="servico-descricao">
            </div>
            <br>
            <button type="submit">Guardar Serviço</button>
        </form>

        <h2>Serviços Cadastrados</h2>
        
        <!-- Tabela de Serviços -->
        <table border="1" style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr>
                    <th>Nome do Serviço</th>
                    <th>Descrição</th>
                    <th>Preço (R$)</th>
                </tr>
            </thead>
            <tbody id="tabela-servicos">
                <!-- Os serviços aparecerão aqui -->
            </tbody>
        </table>
    </main>

    <script src="../src/js/cadastro-servico.js"></script>
</body>
</html>
