<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Tutor</title>


    <style>
        body {font-family: sans-serif; padding: 20px; }
        .form-group {margin-bottom:  15px; }
        label {display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; max-width: 400px; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #4CAF50; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #45a049; }
    </style>
</head>
<body>

    <h1>Cadastro de Novo Tutor</h1>

    <form id="formCadastroTutor">
        <div class="form-group">
            <label for="nomeTutor">Nome Completo:</label>
            <input type="text" id="nomeTutor" name="nomeTutor" required placeholder="Ex: Robert Williams">
        </div>

        <div class="form-group">
            <label for="telefoneTutor">Telefone (WhatsApp):</label>
            <input type="tel" id="telefoneTutor" name="telefoneTutor" required placeholder="(85) 90000-0000">
        </div>

        <div class="form-group">
            <label for="emailTutor">E-mail:</label>
            <input type="email" id="emailTutor" name="emailTutor" placeholder="robert@email.com">
        </div>

        <button type="submit">Cadastrar Tutor</button>
    </form>

    <script src="./src/js/cadastro-tutor.js"></script>
    
</body>
</html>
